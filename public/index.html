<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#175d29" />
    <meta data-static-seo="true" name="robots" content="index, follow" />
    <meta data-static-seo="true" name="googlebot" content="index, follow" />

    <!-- Production builds generate unique metadata for each route. React replaces
         these marked fallback tags after mounting, preserving one set of metadata. -->
    <meta data-static-seo="true" name="description" content="IT asset management and laptop logistics in Chennai. Panchathan Logistics handles laptops, desktops, servers, courier and cargo shipments across India." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <meta name="author" content="Panchathan Logistics" />

    <!-- Geo targeting: Chennai, Tamil Nadu, India -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Chennai" />
    <meta name="geo.position" content="12.9716;80.1256" />
    <meta name="ICBM" content="12.9716, 80.1256" />

    <!-- Open Graph (static fallback for non-JS social crawlers) -->
    <meta data-static-seo="true" property="og:type" content="website" />
    <meta data-static-seo="true" property="og:site_name" content="Panchathan Logistics" />
    <meta data-static-seo="true" property="og:title" content="IT Asset Management & Logistics Chennai | Panchathan Logistics" />
    <meta data-static-seo="true" property="og:description" content="IT asset management and laptop logistics in Chennai. Panchathan Logistics handles laptops, desktops, servers, courier and cargo shipments across India." />
    <meta data-static-seo="true" property="og:url" content="https://panchathanlogistics.com/" />
    <meta data-static-seo="true" property="og:image" content="https://panchathanlogistics.com/logo-480.webp" />
    <meta data-static-seo="true" property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta data-static-seo="true" name="twitter:card" content="summary" />
    <meta data-static-seo="true" name="twitter:title" content="IT Asset Management & Logistics Chennai | Panchathan Logistics" />
    <meta data-static-seo="true" name="twitter:description" content="IT asset management, laptop logistics and cargo transport from Chennai across India." />
    <meta data-static-seo="true" name="twitter:image" content="https://panchathanlogistics.com/logo-480.webp" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title data-static-seo="true">IT Asset Management & Logistics Chennai | Panchathan Logistics</title>



  </head>
  <body>
    <noscript>Panchathan Logistics provides IT asset management, laptop and computer logistics, courier and cargo services from Pammal, Chennai across India.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
