<!DOCTYPE html>
<html lang="en-IN">

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#175d29" />
    <meta name="robots" content="index, follow" />

    <!--
      Note: meta description, keywords, and canonical are set per-page by the
      <SEO> component (react-helmet-async) for the 5 in-app routes. Google's
      renderer executes JS and will pick those up; only the tags below stay
      static because social-preview crawlers (Facebook, WhatsApp, Slack, etc.)
      don't execute JS and only ever see this raw HTML.
    -->
    <meta name="author" content="Panchathan Logistics" />

    <!-- Geo targeting: Chennai, Tamil Nadu, India -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Chennai" />
    <meta name="geo.position" content="12.9716;80.1256" />
    <meta name="ICBM" content="12.9716, 80.1256" />

    <!-- Open Graph (static fallback for non-JS social crawlers) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Panchathan Logistics" />
    <meta property="og:title" content="Panchathan Logistics — Courier & Cargo Services in Chennai, Tamil Nadu" />
    <meta property="og:description" content="One stop for all your courier and cargo needs — serving Chennai, Tamil Nadu and pan-India with air, sea and road freight." />
    <meta property="og:url" content="https://panchathanlogistics.com/" />
    <meta property="og:image" content="https://panchathanlogistics.com/Logo.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Panchathan Logistics — Courier & Cargo Services in Chennai, Tamil Nadu" />
    <meta name="twitter:description" content="One stop for all your courier and cargo needs — serving Chennai, Tamil Nadu and pan-India." />
    <meta name="twitter:image" content="https://panchathanlogistics.com/Logo.png" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Panchathan Logistics — Courier & Cargo Services in Chennai, Tamil Nadu</title>
